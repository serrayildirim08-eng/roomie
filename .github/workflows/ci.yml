name: CI

# Runs the correctness gates on every push to main and every PR, so a
# regression can't quietly reach a dogfood build. All three gates are green as
# of the Phase-1 stabilization pass; format:check is informational (the repo
# has known formatting drift to clean up separately).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Format (informational)
        run: npm run format:check
        continue-on-error: true
