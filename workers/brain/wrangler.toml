# Roomie Brain — draft generator. Deliberately separate from Ollie's ai-proxy
# (own worker, own secrets, own fate). The worker NEVER persists anything:
# it turns one household note into draft fragments; the app writes only after
# the user confirms (draft-first, the inverse of Ollie's write-then-undo).
#
# Secrets (wrangler secret put):
#   GROQ_API_KEY  — primary classifier (gpt-oss-120b, JSON mode)
#   CLERK_ISSUER  — Roomie's Clerk instance (JWT verify)
# Fallback model is Cloudflare Workers AI (binding below, no key needed).

name = "roomie-brain"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[ai]
binding = "AI"

[observability]
enabled = true

# Per-user daily call cap (rate-limit.ts). Without this binding the worker
# falls back to a crude in-memory global guard.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "5a655a73cd474582a2b6db5c5bdd8c1f"
