# Roomie Brain — draft generator. Deliberately separate from Ollie's ai-proxy
# (own worker, own secrets, own fate). The worker NEVER persists anything:
# it turns one household note into draft fragments; the app writes only after
# the user confirms (draft-first, the inverse of Ollie's write-then-undo).
#
# Secrets (wrangler secret put):
#   GROQ_API_KEY  — primary classifier (gpt-oss-120b, JSON mode)
#   CLERK_ISSUER  — Roomie's Clerk instance (JWT verify)
# Fallback model is Cloudflare Workers AI (binding below, no key needed).

name = "roomie-brain"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[ai]
binding = "AI"

[observability]
enabled = true

# Per-user daily call cap (rate-limit.ts). Until this KV namespace is bound the
# worker falls back to a crude in-memory global guard — fine for one-flat
# dogfood, but bind this BEFORE letting strangers/other households in.
# Provision + wire up:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the printed id below and uncomment:
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste-id-here>"
